<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MLF1 Learn</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // apply theme before paint
    (function () {
      var t = localStorage.getItem('mlf1.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img src="/img/favicon.svg" alt="" width="28" height="28">
      <span>MLF1 <b>Learn</b></span>
    </a>
    <nav class="topnav">
      <a href="#/" data-nav="home">Roadmap</a>
      <a href="#/glossary" data-nav="glossary">Glossary</a>
      <a href="#/cheatsheet" data-nav="cheatsheet">Cheat sheet</a>
    </nav>
    <div class="topright">
      <div class="overall-progress" id="overall-progress" title="Overall progress"></div>
      <button class="icon-btn" id="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
      <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>
  <main id="app" class="app"><div class="loading-screen">Loading…</div></main>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/python/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/runmode/runmode.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
